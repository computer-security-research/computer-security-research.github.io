# Journal-level configuration. Read by tools/generate.py.
# ASCII only. Values here become Highwire citation_* journal fields.

title = "Computer Security Research"
# Canonical base URL. Org GitHub Pages site serves at the host root.
# Article/PDF URLs are derived from this and MUST never change once indexed
# by Google Scholar (Scholar forbids URL changes; 301 only).
base_url = "https://computer-security-research.github.io"
publisher = "Computer Security Research"
# ISSN: leave empty until assigned. Empty => citation_issn tag omitted
# (a placeholder ISSN is worse than none for Scholar).
issn = ""
# Default license applied to articles that do not override it.
license = "CC-BY-4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
language = "en"

# Consistent footer navigation, rendered identically on every page (relative
# hrefs are resolved from each page's depth). No project/family links -- the
# journal is vendor-neutral and standalone.
footer_links = [
  { title = "Home", href = "index.html" },
  { title = "About", href = "about/" },
  { title = "Editorial Policy", href = "editorial-policy/" },
  { title = "License", href = "license/" },
  { title = "RSS", href = "feed.xml" },
]
