]
quotes = [
  { text = "If not carefully controlled, such exploits can be abused by malware author to gain unauthorized root privilege.", label = "Root exploits reusable by malware", note = "Zhang, She, Qian, Android Root and its Providers: A Double-Edged Sword, CCS 2015, abstract (cs.ucr.edu/~zhiyunq/pub/ccs15_root_providers.pdf). Verbatim; source prints the singular 'malware author'. Cited in Sec. 4." },
  { text = "With full control over the device, a user can uninstall bloatware, enjoy the additional functionalities by specialized apps that require root privileges, or run paid apps for free.", label = "Rooting motivations", note = "Same source, Introduction. Supports the Appendix B motivations taxonomy." },
  { text = "They allow users to bypass restrictions set by carriers, operating systems, and hardware manufactures.", label = "Bypassing carrier/vendor restrictions", note = "Same source, Introduction. Verbatim; source prints 'manufactures'." },
]

[sadeghi-property-attestation]
label = "Property-based attestation -- certify properties, not a specific binary (NSPW 2004)"
