quotes = [
  { text = "KernelSU provides a module mechanism that achieves the effect of modifying the system directory while maintaining the integrity of the system partition. This mechanism is commonly known as \"systemless\".", label = "Systemless -- /system left intact", note = "KernelSU Documentation, Module Guide (kernelsu.org/guide/module.html). Verified verbatim against the live page." },
