# Source quotes -- structured reviewer-aid sidecar.
# Keyed by @citekey; attribution (author, venue, title, url, retrieved)
# is pulled from refs.bib by journal-maker. Quotes are verbatim.

[aosp-selinux]
label = "SELinux -- MAC binds even root; confinement limits a compromise's reach"
claims = [
  { section = "Sec. 3", text = "SELinux confines even uid-0 processes to permitted domains." },
  { section = "Sec. 2", text = "SELinux confinement contains a compromise -- it protects and confines system services and reduces the effects of malicious software, so one component's compromise does not yield the whole system." },
]
quotes = [
  { text = "\"Android uses Security-Enhanced Linux (SELinux) to enforce mandatory access control (MAC) over all processes, even processes running with root/superuser privileges (Linux capabilities).\"" },
  { text = "Android can better protect and confine system services, control access to application data and system logs, reduce the effects of malicious software, and protect users from potential flaws in code on mobile devices.", label = "Confines services, reduces malware's reach", note = "Android Open Source Project, Security-Enhanced Linux in Android." },
]

[kernel-lockdown]
label = "Kernel lockdown -- withdraws root-accessible interfaces"
claims = [
  { section = "Sec. 3", text = "lockdown withdraws otherwise root-accessible interfaces used to modify the running kernel." },
]
quotes = [
  { text = "\"The Kernel Lockdown feature is designed to prevent both direct and indirect access to a running kernel image, attempting to protect against unauthorized modification of the kernel image...\"" },
]

[kernel-module-signing]
label = "Module-signature enforcement -- no unsigned module load"
claims = [
  { section = "Sec. 3", text = "enforcement can require a valid signature on loaded code, so root cannot insert an arbitrary module." },
]
quotes = [
  { text = "\"This allows increased kernel security by disallowing the loading of unsigned modules or modules signed with an invalid key.\"" },
]

[kernel-modules-disabled]
label = "kernel.modules_disabled -- one-way, even root cannot reverse"
claims = [
  { section = "Sec. 3", text = "once set, blocks all further module loading in a one-way fashion." },
]
quotes = [
  { text = "\"A toggle value indicating if modules are allowed to be loaded in an otherwise modular kernel. This toggle defaults to off (0), but can be set true (1). Once true, modules can be neither loaded nor unloaded, and the toggle cannot be set back to false.\"" },
]

[aosp-verified-boot]
label = "Verified Boot -- hardware root of trust, refuse unsigned"
claims = [
  { section = "Sec. 3", text = "AVB anchors the boot chain to a hardware root of trust." },
]
quotes = [
  { text = "\"Verified Boot strives to ensure all executed code comes from a trusted source (usually device OEMs), rather than from an attacker or corruption. It establishes a full chain of trust, starting from a hardware-protected root of trust to the bootloader, to the boot partition and other verified partitions...\"" },
]

[play-integrity-improvements]
label = "Play Integrity -- verdict tiers are hardware-backed"
claims = [
  { section = "Sec. 8", text = "verdicts are tiered (basic / device-integrity / stronger hardware-backed), tied to a certified configuration." },
]
quotes = [
  { text = "\"Play Integrity API already uses key attestation to obtain hardware-backed security signals on some devices and will now integrate them more deeply on all devices running Android 13 or later.\"" },
]

[aosp-auto-backup]
label = "Auto Backup -- OS-mediated, app-configured, size-capped; covers only apps that permit it"
claims = [
  { section = "Sec. 5", text = "the backup is mediated by the operating system -- Auto Backup includes only system-assigned app directories, apps include and exclude files, and it is capped per app, so it is partial, not a full device image." },
  { section = "Sec. 7", text = "backup is enabled via the manifest; apps that disable it are omitted." },
]
quotes = [
  { text = "\"Auto Backup for Apps automatically backs up a user's data from apps that target and run on Android 6.0 (API level 23) or higher.\" / \"Your app can customize the backup process or opt out by disabling backups.\" / \"By default, Auto Backup includes files in most of the directories that are assigned to your app by the system.\" / \"You can configure your app to include and exclude particular files.\" / \"Every app can allocate up to 25 MB of backup data per app user.\"" },
]

[aosp-file-based-encryption]
label = "File-based encryption -- mandatory since Android 10; keys protected in hardware (TEE)"
claims = [
  { section = "Sec. 7, 11", text = "FBE mandatory on devices launched with Android 10+, available since Android 7." },
  { section = "Sec. 2", text = "FBE encryption keys are protected by Keymaster/KeyMint in a Trusted Execution Environment -- the key is bound to dedicated hardware." },
]
quotes = [
  { text = "\"Android 7.0 and higher supports file-based encryption (FBE).\" / \"All devices launching with Android 10 and higher are required to use file-based encryption.\"" },
  { text = "KeyMint/Keymaster and Gatekeeper must be implemented in a Trusted Execution Environment (TEE) to provide protection for the DE keys so that an unauthorized OS (custom OS flashed onto the device) cannot simply request the DE keys.", label = "Keys bound to the TEE (dedicated hardware)", note = "Android Open Source Project, File-Based Encryption." },
]

[play-integrity-overview]
label = "Play Integrity overview -- separate app- and account-integrity fields"
claims = [
  { section = "Sec. 8", text = "the API additionally returns app-integrity and account-integrity fields, not reproduced in the paper's device-state table." },
]
quotes = [
  { text = "\"App integrity: Check that appRecognitionVerdict is PLAY_RECOGNIZED,\" / \"Account details: Check that appLicensingVerdict is LICENSED,\"" },
]

[aosp-key-id-attestation]
label = "Key attestation -- hardware-backed key storage"
claims = [
  { section = "Sec. 8", text = "attestation is backed by hardware-backed key storage." },
]
quotes = [
  { text = "\"When hardware-backed key storage is available and used, key material is more secure against extraction from the device...\"" },
]

[owasp-mastg-play-integrity]
label = "OWASP MASTG -- device-integrity verdict verifies the environment"
claims = [
  { section = "Sec. 8, 12", text = "apps gate on the hardware-backed device-integrity verdict." },
]
quotes = [
  { text = "\"Device Integrity: This section presents information that verifies the authenticity of the Android environment in which the app is running.\"" },
]

[grapheneos-attestation-compat]
label = "GrapheneOS -- apps ban it; strong tier == hardware key attestation"
claims = [
  { section = "Sec. 8", text = "owner-controlled configs fail device/strong verdicts; a catalog of apps refuse to run. (The no-spoofing stance is GrapheneOS-specific -- see [grapheneos-usage]; it does not hold for all aftermarket projects, since CalyxOS and /e/OS ship microG, which signature-spoofs.)" },
]
quotes = [
  { text = "\"Play Integrity API strong integrity level is directly based on the hardware key attestation API, but apps using it directly can support aftermarket operating systems...\" / \"This is a list of the apps banning GrapheneOS with the Play Integrity API...\"" },
  { text = "The hardware attestation API also provides other useful information signed by the hardware including the OS patch level, in a way that even an attacker exploiting the OS after boot to gain root cannot trivially bypass.", label = "Attestation not forgeable by post-boot root", note = "Attestation Compatibility Guide; reused in the Sec. 12 root discussion. Verified verbatim via host curl." },
]

[aosp-full-disk-encryption]
label = "Full-disk encryption -- master key bound to hardware"
claims = [
  { section = "Sec. 11", text = "the FDE master key is bound to hardware (TEE), not a copyable file." },
]
quotes = [
  { text = "\"Added hardware-backed storage of the encryption key using Trusted Execution Environment's (TEE) signing capability (such as in a TrustZone).\" / \"The master key is encrypted with 128-bit AES via calls to the OpenSSL library.\"" },
]

[google-play-protect-remove]
label = "Play Protect -- a privileged GMS component that disables/removes other apps"
claims = [
  { section = "Sec. 12", text = "Unlike an ordinary sandboxed third-party app, Play Protect ships as a privileged part of Google Mobile Services and can disable or automatically remove other apps on the device -- yet it still runs inside the running OS." },
]
quotes = [
  { text = "The most harmful PHAs are automatically removed from the device, while less severe PHAs are disabled.", label = "Removes/disables other apps", note = "Google, Play Protect On-device protections (developers.google.com/android/play-protect/client-protections); verified verbatim." },
  { text = "Google Play Protect can remove the PHA from affected devices and block future installs.", label = "Device-wide removal" },
]

[grapheneos-auditor]
label = "GrapheneOS Auditor -- hardware-backed remote attestation from a second device"
claims = [
  { section = "Sec. 12", text = "GrapheneOS provides hardware-backed remote attestation an owner can verify from a second device." },
  { section = "Sec. 12", text = "The released Auditor recognizes only verified-boot keys compiled into it; for a self-signed (alternate-OS) state these are the official GrapheneOS keys, so an owner's self-generated verified-boot key is not recognized, and an owner-signed build needs an owner-configured Auditor and Attestation Server." },
]
quotes = [
  { text = "\"The Auditor app uses hardware-based security features to validate the identity of a device, along with the authenticity and integrity of the operating system. It ensures the device is running a verified operating system with a locked bootloader and that no tampering has occurred.\" / \"Any device with Android 13 or higher can run the Auditor app and use it to verify other devices. However, only devices launched with Android 8.0 or later have the necessary hardware support for being verified.\"" },
  { text = "Alternative operating systems need their verified boot key included in the Auditor app and Attestation Server.", label = "Released app recognizes only compiled-in keys", note = "attestation.app/about; corroborated in Auditor source AttestationProtocol.java -- the self-signed branch pins only official GrapheneOS keys and rejects any unpinned verified-boot key." },
]

[grapheneos-attestation-server]
label = "Owner can self-host the attestation server"
claims = [
  { section = "Sec. 12", text = "The attestation server is Open Source, so an owner can run their own instance for remote verification rather than rely on the public service." },
]
quotes = [
  { text = "This is a generic guide on setting up the attestation server.", label = "Self-hostable", note = "AttestationServer README; the server is Open Source (MIT-licensed), so an owner can run their own instance instead of the public attestation.app service." },
]

[grapheneos-attestation-400]
label = "Forum report -- owner-AVB-key device rejected (HTTP 400) by the official attestation service"
quotes = [
  { text = "My bootloader is locked with my AVB key. When I try to enable remote attestation, I am greeted with a response code: 400 notification.", label = "Owner key -> HTTP 400 from attestation.app", note = "discuss.grapheneos.org discussion 24128 (2025-07-17), user cancername; the sole reply offers generic troubleshooting and the report is left unresolved. Verified via sandbox render of the forum page." },
]

[resign-android-image]
label = "resign-android-image -- owner re-signs GrapheneOS OTAs with own keys; cannot pass Play Integrity"
quotes = [
  { text = "Currently no bypass for Play Integrity is included, the best solution is to modify the specific applications to remove the Play Integrity-related checks (if they aren't fully server-side) or failing that to install Magisk and a module that spoofs the Play Integrity verdict.", label = "Owner-signed build cannot satisfy Play Integrity", note = "chriswoope/resign-android-image README (pinned aca8607e, MIT). The tool re-signs GrapheneOS OTA updates with the owner's own AVB + APK keys for a bootloader re-locked to the owner key, without a full source rebuild; tested only on Pixel 6 Pro and Pixel Tablet. Verified verbatim." },
]

[grapheneos-auditor-domain]
label = "Auditor source -- the attestation server domain is hardcoded"
quotes = [
  { text = 'static final String DOMAIN = "attestation.app";', label = "Released Auditor pins attestation.app", note = "GrapheneOS/Auditor RemoteVerifyJob.java (pinned d5d3264); BASE_URL derives from it and AttestationActivity rejects a remote-verify QR whose domain is not DOMAIN, so remote verification against a self-hosted server needs the app rebuilt with a changed domain. Verified verbatim." },
]

[grapheneos-auditor-issue140]
label = "AttestationServer issue 140 -- official Auditor pins its server; both trees must be modified"
quotes = [
  { text = "Yes, you will need to substitute values in both AttestationServer and Auditor to accommodate your setup.", label = "Both app and server must be modified", note = "GrapheneOS/AttestationServer issue 140; GrapheneOS maintainer flawedworld (2022-01-21). Maintainer thestinger adds the official Auditor 'could eventually support other servers but it doesn't at the moment.' The report is the 'Scanned invalid account QR code' a self-hosted server triggers. Verified via the GitHub API." },
]

[grapheneos-auditor-usecase]
label = "GrapheneOS maintainer -- Auditor enforces a whitelisted verified-boot key, never arbitrary yellow-state keys"
quotes = [
  { text = "Auditor enforces that the device has a locked bootloader, green or yellow verified boot state and a whitelisted verified boot key among the other things it enforces. It determines the OS based on the verified boot key.", label = "Only whitelisted keys accepted", note = "discuss.grapheneos.org d/8235 post 4, the official GrapheneOS account (forum moderator), 2023-10-17; the same post adds the Auditor 'never allows arbitrary yellow boot state key fingerprints.' Verified via sandbox render." },
]

[robotnix-attestation]
label = "robotnix -- build system that keys the Auditor app + AttestationServer to owner-created keys"
quotes = [
  { text = "Robotnix patches the Auditor app and Remote Attestation service to allow for using the user-created keys.", label = "Owner-key Auditor + server", note = "nix-community/robotnix docs/src/modules/attestation.md (pinned b731f1a, MIT). The signing module supplies owner keys; apps.auditor and services.attestation-server rebuild the app and server keyed to the owner's Auditor-signature and AVB fingerprints. Third-party tooling, not GrapheneOS; documented limit of one custom device per attestation service. Verified verbatim." },
]

[diamaneos-attestation]
label = "DiamaneOS -- downstream fork accepting an owner-rooted (self-signed, no manufacturer root) key"
quotes = [
  { text = "Some phones attest only with keys that chain to no manufacturer root. A second trust profile accepts their first pairing under these conditions: [...] The phone is locked, boots with a configured OS key and reports self-signed verified boot.", label = "Second trust profile -- self-signed, no manufacturer root", note = "DiamaneOS/AttestationServer DOWNSTREAM.md (pinned 0308fc1). DiamaneOS forks both Auditor and AttestationServer; trusted keys live in src/main/resources/.../diamaneos-trust.json, overridable via -Ddiamaneos.trust, and a profile-2 pairing waits for the account holder's approval. Verified verbatim." },
]

