  { text = "It is important to note that this does not necessarily reflect the relative security of iOS devices compared to Android devices, or other operating systems and phone manufacturers.", label = "iOS focus does not imply iOS is more secure" },
  { text = "Amnesty International's investigations, corroborated by secondary information we have received, seem to suggest that Pegasus is no longer maintaining persistence on iOS devices. Therefore, binary payloads associated with these processes are not recoverable from the non-volatile filesystem. Instead, one would need to be able to jailbreak the device without reboot, and attempt to extract payloads from memory.", label = "Non-persistent payload -- recoverable only from memory, not the filesystem artifact-based tools read", note = "Amnesty International, Forensic Methodology Report (amnesty.org/.../forensic-methodology-report-how-to-catch-nso-groups-pegasus). Verbatim; source uses a typographic apostrophe in 'International's', normalized to ASCII here. Reinforces Sec. 9/12: an in-memory implant leaves no static filesystem trace for an IOC/artifact-based tool like MVT to find." },
  { text = "These also include so-called \"zero-click\" attacks which do not require any interaction from the target.", label = "Zero-click: no interaction required", note = "Amnesty International, Forensic Methodology Report. Verified verbatim. Cited in Sec. 15 for 'delivered zero-click'; the canonical zero-click Pegasus exploit analysis is projectzero-forcedentry, whose title names the zero-click iMessage exploit." },
