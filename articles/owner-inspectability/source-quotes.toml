  { section = "Sec. 8", text = "content-protection components rely on hardware-backed DRM to secure premium content; a device lacking the hardware features cannot present it, so playback is restricted (silently degraded) rather than refused outright." },
]
quotes = [
  { text = "The Android platform provides an extensible DRM framework that lets apps manage rights-protected content according to the license constraints associated with the content.", label = "Rights-protected content on the provider's terms", note = "Android Open Source Project, DRM (Framework section); verified verbatim against the live page." },
  { text = "The DRM plugin is integrated with the Android DRM framework and can use hardware-backed protection to secure premium content and user credentials.", label = "Hardware-backed protection of premium content" },
  { text = "The hardware capabilities of the device should include hardware secure boot to establish a chain of trust of security and protection of cryptographic keys.", label = "Anchored to the same hardware chain of trust as verified boot" },
  { text = "Content protection capabilities of the device should include protection of decrypted frames in the device and content protection through a trusted output protection mechanism.", label = "Decoded frames protected from the owner via a trusted output path" },
  { text = "Not all hardware platforms support all of the above security and content protection features.", label = "no hardware level -> premium content restricted/degraded", note = "AOSP DRM, Plugins section; verified verbatim against the live page." },
]

