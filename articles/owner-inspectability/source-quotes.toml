  { text = "To reproduce a past build, you need to export BUILD_DATETIME and BUILD_NUMBER to the values set for the past build.", label = "Documented reproducible-build procedure", note = "GrapheneOS, Build, 'Reproducible builds' section (grapheneos.org/build#reproducible-builds). Verified verbatim. Supports the paper's description of GrapheneOS as a public project with a reproducible build (Sec. 12)." },
