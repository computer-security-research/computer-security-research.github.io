]

[mayrhofer-android-security-model]
label = "Android Platform Security Model -- per-app UID sandbox"
claims = [
  { section = "Secs. 5, 7", text = "each app gets a distinct UNIX UID and a private directory owned by the app, so other apps cannot read it (the DAC application sandbox)." },
]
quotes = [
  { text = "\"providing each application with a unique UNIX user ID (UID) and a directory owned by the app.\"", label = "Sec. 4.3.2" },
  { text = "\"With very few exceptions, the process boundary is where security decisions are made and enforced.\"", label = "Supporting, Sec. 4.3" },
  { text = "a non-compliant change which violates CDD", label = "Owner + malicious rooting are the same class (Rule 3)", note = "arXiv:1904.05572 Sec. 3: 'Such rooting, both intentional and malicious, is a specific example of a non-compliant change which violates CDD' -- 'intentional' = the owner. Fragments 'both intentional and malicious' and this phrase verified verbatim via self-extracted arXiv PDF." },
  { text = "a legal concept rather than a technical one and therefore outside the scope of an OS security model", label = "Ownership scoped out of the model", note = "arXiv:1904.05572 Sec. 3, of the word 'ownership' ('Control over data also does not imply ownership -- [which] is a legal concept ...'). Verified verbatim via self-extracted arXiv PDF." },
  { text = "No action should be executed unless all main parties agree ... Any one party can veto the action.", label = "Multi-party authorization (Rule 1)", note = "arXiv:1904.05572 Sec. 3, Rule 1: 'No action should be executed unless all main parties agree -- in the standard case, these are user, platform, and developer ... Any one party can veto the action.' Fragments verified verbatim via self-extracted arXiv PDF; ellipsis marks the omitted 'in the standard case, these are user, platform, and developer' clause, also verified." },
]

[magisk-install]
label = "Magisk -- systemless root needs an unlocked bootloader; patches the ramdisk, not /system"
claims = [
  { section = "Sec. 8", text = "modern rooting is systemless, patching the partition image that holds the ramdisk (and the init it carries) rather than /system, and still requires an unlocked bootloader to reflash that image, so it still forfeits the verified-boot state and hardware-backed verdicts. (Which partition holds the ramdisk varies by device -- boot, init_boot on Android 13+, or vendor_boot/recovery -- but it is never /system; the Magisk docs phrase it as \"the partition image that contains the ramdisk\".)" },
]
quotes = [
  { text = "\"Your device's bootloader has to be unlocked\" / \"you need to patch the partition image that contains the ramdisk\"." },
]

[magisk-details]
label = "Magisk -- patched init runs first and shapes the SELinux policy it then runs under"
claims = [
  { section = "Sec. 8", text = "modern root is control of init: the patched init runs before the SELinux policy is loaded (init loads it in userspace via security_load_policy, which magiskinit LD_PRELOAD-hooks), so the installer authors the policy its own daemon runs under (an unconstrained, permissive domain) rather than being confined by it -- an administrative-tier initramfs modification, not an enlargement of in-system root." },
]
quotes = [
  { text = "\"magiskinit replaces init as the first program to run.\" / \"Sets LD_PRELOAD (init-ld) on init to hook security_load_policy\" / \"An unconstrained, permissive domain that magiskd and all root shells run in.\"" },
]

[magisk-ota]
label = "Magisk OTA -- leaving read-only partitions intact keeps OTAs applicable; root re-applied after"
claims = [
  { section = "Sec. 8", text = "leaving /system byte-identical keeps official OTAs applicable (not blocked as a modified /system would be); an OTA overwrites boot/init_boot, so root does not survive it automatically -- Magisk is restored to stock before the OTA and re-installed to the updated slot after." },
]
quotes = [
  { text = "\"Magisk does not modify read-only partitions by default, which makes applying official OTAs much simpler.\" / \"When an OTA is available, first go to (Magisk app -> Uninstall -> Restore Images).\" / \"Go to the Magisk app and select (Install -> Install to Inactive Slot (After OTA)) to install Magisk to the updated slot.\"" },
]

[aosp-partitions]
label = "AOSP -- the ramdisk lives in boot (<=A12) or the init_boot partition (A13+)"
claims = [
  { section = "Sec. 8", text = "the partition that holds the ramdisk Magisk patches is named: the boot partition on devices launched with Android 12 or lower, and the dedicated init_boot partition on devices launched with Android 13 or later. (Not exhaustive: some devices use vendor_boot, and devices with no boot ramdisk are patched in recovery; it is never /system.)" },
]
quotes = [
  { text = "\"This partition also contains the generic ramdisk in devices launched in Android 12 and lower.\" (boot) / \"This partition contains a generic ramdisk. In Android 11 and 12, the generic ramdisk is in the boot partition.\" (init_boot)" },
]

[aosp-dm-verity]
label = "AOSP dm-verity -- editing /system fails verification (why systemless)"
claims = [
  { section = "Sec. 8", text = "dm-verity is the integrity mechanism protecting /system (a hashtree); verified boot covers /system and boot/init_boot alike, so neither is editable on a locked device. dm-verity plus read-only EROFS/super make /system a harder, read-only target than the single flashable boot image -- a secondary reason the method patches boot, not because boot is unprotected." },
