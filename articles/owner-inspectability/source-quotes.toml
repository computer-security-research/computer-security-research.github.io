  { text = "theoretically possible to do it in a way that doesn't throw away a lot of security", label = "Secure-ish root theoretically possible", note = "Same comment; of the constrained terminal above. Verified verbatim." },
  { text = "isn't being done by anyone right now", label = "But unbuilt", note = "Same comment; no project ships such a constrained root. Verified verbatim." },
  { text = "totally ruining verified boot by trusting persistent state", label = "Persistent-state root ruins verified boot", note = "Same comment; directed at the way root-enabled forks integrate root (persistent, fully trusted), NOT the non-persistent terminal. Verified verbatim." },
]

