]
quotes = [
  { text = "the attestation of a platform should not depend on the specific software or/and hardware (configuration) as it is today's practice but only on the \"properties\" that the platform offers.", label = "Attest properties, not a specific configuration", note = "Sadeghi, Stueble, Property-based Attestation for Computing Platforms, NSPW 2004, abstract (TU Darmstadt author copy, download.hrz.tu-darmstadt.de). Verbatim; source uses typographic quotation marks around 'properties', rendered ASCII here. Cited in Sec. 4." },
]

[saltzer-schroeder]
