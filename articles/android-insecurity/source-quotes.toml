]
quotes = [
  { text = "\"The seller shall be liable to the consumer for any lack of conformity which exists at the time when the goods were delivered and which becomes apparent within two years...\" (NOTE: the \"causal link to the modification\" is the paper's synthesis of the conformity- liability framework, not a single verbatim clause)" },
]

[samsung-knox-hw-security]
label = "Samsung Knox -- one-time e-fuse (Warranty Bit) is irreversible"
claims = [
  { section = "Sec. 13", text = "unlocking permanently trips a one-time-programmable e-fuse disabling hardware-backed attestation, not resettable." },
]
quotes = [
  { text = "\"This record is stored in a one-time hardware e-fuse, permanently marking the device as having a non approved configuration, regardless of any future actions.\"" },
]

[sony-unlock-bootloader]
label = "Sony -- unlocking removes DRM security keys"
claims = [
  { section = "Sec. 13", text = "unlocking irrevocably erases device-unique keys that relocking does not restore." },
]
quotes = [
  { text = "\"content on your device may also be inaccessible due to the removal of DRM security keys. ... the removal of DRM security keys may affect advanced camera functionality.\" (NOTE: the \"relocking does not restore\" characterization is the paper's; this page documents that unlocking removes the DRM security keys)" },
]

[qualcomm-secure-boot]
label = "Qualcomm -- secure boot enabled by blowing a one-time eFuse"
claims = [
  { section = "Sec. 13", text = "one-time-programmable eFuse hardware is the standard SoC primitive for secure-boot enablement and anti-rollback, a one-way operation." },
]
quotes = [
  { text = "\"secure boot is guaranteed only after blowing a QFPROM, which is an eFuse. The eFuse configuration required to enable platform secure boot includes: Enabling image authentication and anti-rollback protection. Disabling debug and JTAG access.\"" },
]

[nguyen-vu-android-rooting]
label = "Rooting arms race -- evasion vs. detection"
claims = [
  { section = "Sec. 13", text = "cloaking tools pass integrity checks only by impersonating a still-vulnerable stock device, in a losing arms race against detection." },
]
quotes = [
  { text = "\"We present an arms race between rooting detection and rooting evasion.\" / \"We then analyze the evasion loopholes and in turn enhance our rooting detection tool.\"" },
]

[zaddach-hdd-backdoor]
label = "Stealth hard-drive firmware backdoor -- below the OS, root-installable"
claims = [
  { section = "Secs. 12, 13", text = "a drive's controller firmware can be compromised with only public information and reverse engineering, installed by ordinary malware after OS compromise, backdooring data as it is written; persistent implants have migrated to low-level firmware beneath the OS." },
]
quotes = [
  { text = "\"we show that it is possible to compromise the firmware of a commercial off-the-shelf hard drive, by resorting only to public information and reverse engineering.\" / \"a firmware backdoor can be installed by, e.g., traditional malware after the operating system has been compromised.\" / \"the target of the infection has shifted from software components towards more low-level elements, such as bootloaders, virtual-machine hypervisors, computer BIOS, and recently even the hardware itself.\"" },
]

[kaspersky-equation]
label = "Equation nls_933w -- in-the-wild drive-firmware reprogramming"
claims = [
  { section = "Sec. 13", text = "in-the-wild drive-firmware implants (the Equation group) reprogram the drive's firmware." },
]
quotes = [
  { text = "\"It allows them to reprogram the hard drive firmware\"", label = "article body" },
]

[kaspersky-equation-qa]
label = "Equation Q and A -- firmware implant survives formatting and OS reinstall"
claims = [
  { section = "Sec. 13", text = "the drive-firmware implant persists across disk formatting and a full operating-system reinstall." },
]
quotes = [
  { text = "\"Extreme persistence that survives disk formatting and OS reinstall.\"" },
]

[eset-lojax]
label = "LoJax -- first in-the-wild UEFI rootkit, survives reinstall and disk swap"
claims = [
  { section = "Sec. 13", text = "a UEFI implant in the motherboard's SPI flash persists across a full OS reinstall and even a storage replacement, because it does not reside on the storage." },
]
quotes = [
  { text = "\"This persistence method is particularly invasive as it will not only survive an OS reinstall, but also a hard disk replacement.\"" },
]

[ermolov-intel-me]
label = "Intel ME -- chipset co-processor with privileged platform access, owner cannot inspect"
claims = [
  { section = "Sec. 13, Table 4", text = "the Intel Management Engine is a co-processor embedded in the chipset, running Intel-signed firmware with privileged access to platform data, that the owner cannot inspect." },
]
quotes = [
  { text = "\"Intel Management Engine (Intel ME) is a proprietary technology that consists of a microcontroller integrated into the Platform Controller Hub (PCH) chip ... Therefore, Intel ME has access to almost all data on the computer.\"", label = "Sec. 1" },
  { text = "\"ME also has virtually unlimited access to data processed on the computer. ME can intercept and modify network packets as well as images on graphics cards; it has full access to USB devices.\"", label = "Sec. 1.1" },
  { text = "\"Virtually all data used by ME is either explicitly or implicitly signed by Intel.\"", label = "Sec. 2" },
]

[jacob-faultpm]
label = "AMD-SP/PSP -- dedicated security co-processor, root of trust, boots before the x86 cores"
claims = [
  { section = "Sec. 13, Table 4", text = "the AMD Secure Processor (formerly PSP) is a dedicated security co-processor integrated into the SoC that acts as the root of trust and boots before the main cores, running vendor firmware the owner cannot inspect." },
]
quotes = [
  { text = "\"The AMD Secure Processor (AMD-SP) is a dedicated security co-processor part of all recent AMD Systems-on-a-chip (SoCs) ... the AMD-SP (formerly known as Platform Security Processor (PSP)) has acted as the Root of Trust (RoT) of the SoC.\"", label = "Sec. 2.4" },
  { text = "\"The AMD-SP boots before the main X86 cores of the AMD SoC.\"", label = "Sec. 2.4.1" },
  { text = "\"Intel and AMD provide fTPMs with their Desktop CPUs, running on the Intel Management Engine (Intel-ME) and AMD-SP, respectively. Due to the integration of these coprocessors into the main die, they do not require external buses to communicate with the CPU.\"", label = "Sec. 2.1.2" },
]

[rfc9334-rats]
label = "RATS architecture -- Attester proves, Relying Party depends (direction of trust)"
claims = [
  { section = "Sec. 8", text = "remote attestation is a relying-party protocol; the device is the Attester that must produce evidence, a Verifier appraises it, and the Relying Party (app, service, or platform) is the party that depends on the result, so the guarantee runs to the relying party, not the owner." },
]
quotes = [
  { text = "\"A role performed by an entity (typically a device) whose Evidence must be appraised in order to infer the extent to which the Attester is considered trustworthy, such as when deciding whether it is authorized to perform some operation.\"", label = "Attester" },
  { text = "\"A role performed by an entity that depends on the validity of information about an Attester for purposes of reliably applying application-specific actions.\"", label = "Relying Party" },
]

[doctorow-general-computation]
label = "War on general-purpose computing -- owner control is the stake"
claims = [
  { section = "Sec. 8", text = "the attestation-driven loss of owner control -- software running on the owner's device beyond the owner's inspection -- is the phenomenon Doctorow named the coming war on general-purpose computing." },
]
quotes = [
  { text = "\"Lockdown: The coming war on general-purpose computing\"", label = "title" },
]

[play-integrity-verdicts]
label = "Play Integrity device verdict -- locked bootloader + certified image, not malware-freeness"
claims = [
  { section = "Sec. 8", text = "the device-integrity verdict attests boot and configuration state (a locked bootloader and a vendor-certified OS image), not runtime malware-freeness, so a stock, certified, locked device can still be compromised and pass." },
]
quotes = [
  { text = "\"The app is running on a genuine and certified Android device. On Android 13 and higher, there is hardware-backed proof that the device bootloader is locked and the loaded Android OS is a certified device manufacturer image.\"", label = "MEETS_DEVICE_INTEGRITY" },
  { text = "\"The device bootloader can be locked or unlocked, and the boot state can be verified or unverified.\"", label = "MEETS_BASIC_INTEGRITY" },
  { text = "\"On Android 13 and higher, the MEETS_STRONG_INTEGRITY verdict requires MEETS_DEVICE_INTEGRITY and security updates in the last year for all partitions of the device...\"", label = "MEETS_STRONG_INTEGRITY" },
]

[play-protect-certification]
label = "Play Protect certification -- user-facing status, separate from malware protection"
claims = [
  { section = "Sec. 8", text = "Android surfaces a Play Protect certification status to the owner in the Play Store, but it reports compatibility and vendor-approval and is explicitly separate from malware protection." },
]
quotes = [
  { text = "\"Device certification is separate to Google Play Protect, which protects devices from harmful apps.\" / certified devices \"Have passed Android compatibility testing.\"" },
]

[coker-remote-attestation]
label = "Principles of remote attestation -- the general definition"
claims = [
  { section = "Sec. 8", text = "remote attestation is in general the activity of making a claim about a target's properties by supplying evidence to an appraiser over a network." },
]
quotes = [
  { text = "\"Remote attestation is the activity of making a claim about properties of a target by supplying evidence to an appraiser over a network.\"", label = "abstract" },
]

[google-triada]
label = "Triada -- malware built into OEM system images at manufacture"
claims = [
  { section = "Sec. 8", text = "pre-installed vendor code baked into the certified image is attested as approved regardless of behavior; Triada was built into manufacturers' system images during production." },
]
quotes = [
  { text = "\"Triada infects device system images through a third-party during the production process.\" / \"Triada was inconspicuously included in the system image as third-party code for additional features requested by the OEMs.\"" },
]

[apvi-platform-certs]
label = "Android platform certificates leaked, used to sign malware"
claims = [
  { section = "Sec. 12", text = "platform signing keys have leaked and been used to sign malware in the wild, so the secret-key assumption behind verified boot can fail in practice." },
]
quotes = [
  { text = "\"The 'android' application runs with a highly privileged user id -- android.uid.system -- and holds system permissions, including permissions to access user data.\" / \"Any other application signed with the same certificate can declare that it wants to run with the same user id, giving it the same level of access to the Android operating system.\"" },
]

[bootstomp]
label = "BootStomp -- bootloader vulnerabilities subvert the chain of trust"
claims = [
  { section = "Sec. 12", text = "bootloader compromises that would subvert the verified-boot chain of trust have been demonstrated in research." },
]
quotes = [
  { text = "\"Some of these vulnerabilities would allow an attacker to execute arbitrary code as part of the bootloader (thus compromising the entire chain of trust).\"", label = "abstract" },
]

[shakevsky-trustzone]
label = "Samsung TrustZone Keymaster -- hardware key material extracted"
claims = [
  { section = "Sec. 12", text = "a trusted-execution-environment compromise can extract the hardware key material underpinning the keystore and attestation (demonstrated on ~100 million Samsung devices, since patched)." },
]
quotes = [
  { text = "\"We present an IV reuse attack on AES-GCM that allows an attacker to extract hardware-protected key material\" / \"our specific attacks only apply to the ~100 million devices made by Samsung.\"" },
]

[ncc-mediatek-bootrom]
label = "MediaTek BootROM glitch -- unpatchable mask ROM, secure-boot bypass"
claims = [
  { section = "Sec. 12", text = "the boot ROM is the immutable hardware root of trust; a flaw in it is unpatchable, and voltage glitching can bypass secure-boot signature verification (physical access)." },
]
quotes = [
  { text = "\"The BootROM is the immutable first stage in the boot process, and serves as the hardware root of trust for the SoC.\" / \"allowing an adversary to bypass signature verification of the preloader.\" / \"Because this vulnerability manifests in the mask ROM, the issue is unable to be patched for all in-field affected products.\" / \"Voltage glitching attacks require physical access to the target device\"" },
]

[checkm8-vu]
label = "checkm8 -- unpatchable Boot ROM (SecureROM) exploit, physical, non-persistent"
claims = [
  { section = "Sec. 12", text = "boot-ROM flaws are permanent and unpatchable (read-only mask) and not specific to one vendor; the exploit needs physical access and is non-persistent." },
]
quotes = [
  { text = "\"vulnerable to arbitrary code execution at the Boot ROM level (called \\\"SecureROM\\\" by Apple)\" / \"Because SecureROM is read-only, it cannot be patched with a firmware update.\" / \"requires physical access to the device\" / \"The exploit is not persistent; rebooting the device overrides any changes\"" },
]

[ioactive-antifuse]
label = "Antifuse key extraction -- fused root keys readable by invasive FIB"
claims = [
  { section = "Sec. 12", text = "hardware-fused/OTP root keys can be read out by an invasive silicon attack, so \"fused keys are unreadable\" is an assumption, not an absolute (invasive, destructive, lab-grade)." },
]
quotes = [
  { text = "extraction \"by a semiconductor failure analysis technique known as passive voltage contrast (PVC) using a focused ion beam\" / \"show how it can be used to extract significant quantities of sensitive data, such as keys for firmware encryption\"" },
]

[opentitan-rom-patch]
label = "OpenTitan -- vendor-signed ROM-patch path (boot ROM not always immutable)"
claims = [
  { section = "Sec. 12", text = "some SoCs expose a vendor-signed, fuse-gated ROM-patch path, so boot-ROM immutability is a vendor design choice, not a constant; the patch mechanism is vendor-controlled, never owner-controlled." },
]
quotes = [
  { text = "\"A separate OTP patch partition is defined within the OTP controller map.\" / \"Patch stored in each region is fully signed with an appropriate cryptographic signature algorithm - RSA3072 or ECC384.\" / \"The replacement is performed by re-routing instruction fetches to fetch from alternative addresses.\"" },
]

[aosp-device-state]
label = "AOSP Device state -- user-settable root of trust (avb_custom_key), Pixel"
claims = [
  { section = "Sec. 12", text = "on supported devices (Pixel) the owner can enroll a custom AVB signing key and re-lock to it; the custom root of trust is owner-set, physically confirmed, and held in tamper-evident storage." },
]
quotes = [
  { text = "\"Devices can optionally allow the user to configure the root of trust (for example, a public key).\" / \"The user-settable root of trust can only be set by the end user.\" / \"The Google Pixel 2 devices use this approach and the virtual partition is called avb_custom_key.\"" },
]

[nist-hwb-spec]
label = "NIST hardware write blocker -- read-only acquisition does not modify evidence"
claims = [
  { section = "Sec. 13", text = "a write blocker passes read commands while blocking any that would alter the drive, so disk imaging does not modify the evidence." },
]
quotes = [
  { text = "\"The central requirement for a sound forensic examination of digital evidence is that the original evidence must not be modified\". / \"HWB-RM-01 A HWB shall block modifying commands to a protected storage device.\"" },
]

[halderman-coldboot]
label = "Cold-boot attack -- DRAM retains contents after power loss"
claims = [
  { section = "Sec. 13", text = "RAM can be captured from outside the running OS by exploiting DRAM remanence after a cold reboot." },
]
quotes = [
  { text = "\"DRAMs used in most modern computers retain their contents for several seconds after power is lost, even at room temperature and even if removed from a motherboard.\"" },
]

[markettos-thunderclap]
label = "Thunderclap -- DMA peripherals can read all memory; the IOMMU now resists"
claims = [
  { section = "Sec. 13", text = "a DMA-capable peripheral can read system memory from outside the OS, but modern platforms increasingly block it with an IOMMU." },
]
quotes = [
  { text = "\"DMA-enabled I/O peripherals have complete access to the state of a computer and can fully compromise it including reading and writing all of system memory.\" / \"vendors have incorporated support for Input-Output Memory Management Units (IOMMUs), which impose memory protection on DMA\"." },
]

[frisk-pcileech]
label = "PCILeech -- PCIe DMA reads target memory with no target driver"
claims = [
  { section = "Sec. 13", text = "DMA over an expansion bus can capture RAM with no software on the target." },
]
quotes = [
  { text = "\"PCILeech uses PCIe hardware devices to read and write target system memory. This is achieved by using DMA over PCIe. No drivers are needed on the target system.\" (Caveat, same source: \"Recent Windows and Linux versions block DMA by default.\")" },
]

[muller-frost-coldboot]
label = "FROST -- on Android, cold boot first needs unlock, which wipes user data"
claims = [
  { section = "Sec. 13", text = "the demonstrated on-device cold-boot variant on Android first required unlocking the bootloader, which wipes the user data it sought to recover." },
]
quotes = [
  { text = "\"the bootloader must be unlocked before the attack because scrambled user partitions are wiped during unlocking\". / \"Cooling the device down under 10 degree Celsius increases the success of cold boot attacks considerably\"." },
]

[android-allowbackup]
label = "android:allowBackup -- an app can exclude its data from any backup"
claims = [
  { section = "Sec. 5", text = "a \"full backup\" on a non-rooted device is partial and mediated by individual applications, which can opt their data out via the android:allowBackup flag." },
]
quotes = [
  { text = "\"If this attribute is set to \\\"false\\\", no backup or restore of the application is ever performed, disabling all cloud backups and device-to-device (D2D) transfers, even by a full-system backup that otherwise causes all application data to save using adb. The default value of this attribute is \\\"true\\\".\"" },
]

