# Source quotes -- structured reviewer-aid sidecar (see csr-rules).
# Keyed by @citekey; attribution (author, venue, title, url, retrieved)
# is pulled from refs.bib by journal-maker. Quotes are verbatim.

[aosp-selinux]
label = "SELinux -- MAC binds even root"
claims = [
  { section = "Sec. 3", text = "SELinux confines even uid-0 processes to permitted domains." },
]
quotes = [
  { text = "\"Android uses Security-Enhanced Linux (SELinux) to enforce mandatory access control (MAC) over all processes, even processes running with root/superuser privileges (Linux capabilities).\"" },
]

[kernel-lockdown]
label = "Kernel lockdown -- withdraws root-accessible interfaces"
claims = [
  { section = "Sec. 3", text = "lockdown withdraws otherwise root-accessible interfaces used to modify the running kernel." },
]
quotes = [
  { text = "\"The Kernel Lockdown feature is designed to prevent both direct and indirect access to a running kernel image, attempting to protect against unauthorized modification of the kernel image...\"" },
]

[kernel-module-signing]
label = "Module-signature enforcement -- no unsigned module load"
claims = [
  { section = "Sec. 3", text = "enforcement can require a valid signature on loaded code, so root cannot insert an arbitrary module." },
]
quotes = [
  { text = "\"This allows increased kernel security by disallowing the loading of unsigned modules or modules signed with an invalid key.\"" },
]

[kernel-modules-disabled]
label = "kernel.modules_disabled -- one-way, even root cannot reverse"
claims = [
  { section = "Sec. 3", text = "once set, blocks all further module loading in a one-way fashion." },
]
quotes = [
  { text = "\"A toggle value indicating if modules are allowed to be loaded in an otherwise modular kernel. This toggle defaults to off (0), but can be set true (1). Once true, modules can be neither loaded nor unloaded, and the toggle cannot be set back to false.\"" },
]

[aosp-verified-boot]
label = "Verified Boot -- hardware root of trust, refuse unsigned"
claims = [
  { section = "Sec. 3", text = "AVB anchors the boot chain to a hardware root of trust." },
]
quotes = [
  { text = "\"Verified Boot strives to ensure all executed code comes from a trusted source (usually device OEMs), rather than from an attacker or corruption. It establishes a full chain of trust, starting from a hardware-protected root of trust to the bootloader, to the boot partition and other verified partitions...\"" },
]

[play-integrity-improvements]
label = "Play Integrity -- verdict tiers are hardware-backed"
claims = [
  { section = "Sec. 8", text = "verdicts are tiered (basic / device-integrity / stronger hardware-backed), tied to a certified configuration." },
]
quotes = [
  { text = "\"Play Integrity API already uses key attestation to obtain hardware-backed security signals on some devices and will now integrate them more deeply on all devices running Android 13 or later.\"" },
]

[aosp-auto-backup]
label = "Auto Backup -- OS-mediated, app-configured, size-capped; covers only apps that permit it"
claims = [
  { section = "Sec. 5", text = "the backup is mediated by the operating system -- Auto Backup includes only system-assigned app directories, apps include and exclude files, and it is capped per app, so it is partial, not a full device image." },
  { section = "Sec. 7", text = "backup is enabled via the manifest; apps that disable it are omitted." },
]
quotes = [
  { text = "\"Auto Backup for Apps automatically backs up a user's data from apps that target and run on Android 6.0 (API level 23) or higher.\" / \"Your app can customize the backup process or opt out by disabling backups.\" / \"By default, Auto Backup includes files in most of the directories that are assigned to your app by the system.\" / \"You can configure your app to include and exclude particular files.\" / \"Every app can allocate up to 25 MB of backup data per app user.\"" },
]

[aosp-file-based-encryption]
label = "File-based encryption -- mandatory since Android 10, available since Android 7"
claims = [
  { section = "Sec. 7, 11", text = "FBE mandatory on devices launched with Android 10+, available since Android 7." },
]
quotes = [
  { text = "\"Android 7.0 and higher supports file-based encryption (FBE).\" / \"All devices launching with Android 10 and higher are required to use file-based encryption.\"" },
]

[play-integrity-overview]
label = "Play Integrity overview -- separate app- and account-integrity fields"
claims = [
  { section = "Sec. 8", text = "the API additionally returns app-integrity and account-integrity fields, not reproduced in the paper's device-state table." },
]
quotes = [
  { text = "\"App integrity: Check that appRecognitionVerdict is PLAY_RECOGNIZED,\" / \"Account details: Check that appLicensingVerdict is LICENSED,\"" },
]

[aosp-key-id-attestation]
label = "Key attestation -- hardware-backed key storage"
claims = [
  { section = "Sec. 8", text = "attestation is backed by hardware-backed key storage." },
]
quotes = [
  { text = "\"When hardware-backed key storage is available and used, key material is more secure against extraction from the device...\"" },
]

[owasp-mastg-play-integrity]
label = "OWASP MASTG -- device-integrity verdict verifies the environment"
claims = [
  { section = "Sec. 8, 12", text = "apps gate on the hardware-backed device-integrity verdict." },
]
quotes = [
  { text = "\"Device Integrity: This section presents information that verifies the authenticity of the Android environment in which the app is running.\"" },
]

[grapheneos-attestation-compat]
label = "GrapheneOS -- apps ban it; strong tier == hardware key attestation; no spoofing"
claims = [
  { section = "Sec. 8, 12", text = "owner-controlled configs fail device/strong verdicts; a catalog of apps refuse to run; projects will not spoof attestation." },
]
quotes = [
  { text = "\"Play Integrity API strong integrity level is directly based on the hardware key attestation API, but apps using it directly can support aftermarket operating systems...\" / \"This is a list of the apps banning GrapheneOS with the Play Integrity API...\"" },
]

[aosp-full-disk-encryption]
label = "Full-disk encryption -- master key bound to hardware"
claims = [
  { section = "Sec. 11", text = "the FDE master key is bound to hardware (TEE), not a copyable file." },
]
quotes = [
  { text = "\"Added hardware-backed storage of the encryption key using Trusted Execution Environment's (TEE) signing capability (such as in a TrustZone).\" / \"The master key is encrypted with 128-bit AES via calls to the OpenSSL library.\"" },
]

[grapheneos-auditor]
label = "GrapheneOS Auditor -- hardware-backed remote attestation from a second device"
claims = [
  { section = "Sec. 12", text = "GrapheneOS provides hardware-backed remote attestation an owner can verify from a second device." },
]
quotes = [
  { text = "\"The Auditor app uses hardware-based security features to validate the identity of a device, along with the authenticity and integrity of the operating system. It ensures the device is running a verified operating system with a locked bootloader and that no tampering has occurred.\" / \"Any device with Android 13 or higher can run the Auditor app and use it to verify other devices. However, only devices launched with Android 8.0 or later have the necessary hardware support for being verified.\"" },
]

[grapheneos-install-locking]
label = "GrapheneOS -- re-locking anchors verified boot to GrapheneOS's own key"
claims = [
  { section = "Sec. 12", text = "re-locking restores verified boot, but on official builds the root of trust is GrapheneOS's key (not Google's, not the owner's) -- a different vendor, not owner control." },
]
quotes = [
  { text = "\"Locking the bootloader is important as it enables full verified boot.\" / \"Installing GrapheneOS flashes the GrapheneOS verified boot public key to the secure element. Each boot, this key is loaded and used to verify the OS.\"" },
]

[grapheneos-setup-wizard]
label = "GrapheneOS -- first-run flow detects an unlocked bootloader and assists locking"
claims = [
  { section = "Sec. 12", text = "re-locking is part of the supported install/first-run flow." },
]
quotes = [
  { text = "\"It detects an unlocked bootloader at the start and warns the user about it with a button for rebooting to fastboot mode in order to lock the device.\"" },
]

[grapheneos-build]
label = "GrapheneOS -- owner-signed builds: the owner generates and holds the keys"
claims = [
  { section = "Sec. 12", text = "the owner-inspectable configuration is the owner-signed build re-locked to the owner's own enrolled key; the owner generates and keeps the signing keys." },
]
quotes = [
  { text = "\"Keys need to be generated for resigning completed builds from the publicly available test keys.\" / \"there's no value in a locked bootloader without signing the build using release keys, since verified boot will be meaningless and the keys used to verify sideloaded updates are also public.\"" },
]

[aosp-loadable-kernel-modules]
label = "Loadable kernel modules -- GKI module signing not supported; dm-verity instead"
claims = [
  { section = "Sec. 3", text = "module signing is not supported for GKI vendor modules; authenticity rests on dm-verity over the read-only partitions." },
]
quotes = [
  { text = "\"Module-signing is not supported for GKI vendor modules. On devices required to support verified boot, Android requires kernel modules to be in the partitions that have dm-verity enabled. This removes the need for signing individual modules for their authenticity.\"" },
]

[aosp-bootloader-locking]
label = "Bootloader unlock -- mandatory factory data reset"
claims = [
  { section = "Sec. 3, 13", text = "unlocking the bootloader triggers a mandatory wipe of user data." },
]
quotes = [
  { text = "\"After the user acknowledges the warning, the device should perform a factory data reset to prevent unauthorized data access.\" (page body loads via JS; retrieved with a headless chromium render, not raw fetch)" },
]

[rowlingson-forensic-readiness]
label = "Forensic readiness -- an institutional posture, distinct from owner-inspectability"
claims = [
  { section = "Sec. 3", text = "forensic readiness is an organization's advance preparation for investigators, not a property a device affords its owner." },
]
quotes = [
  { text = "\"Forensic readiness is defined as the ability of an organisation to maximise its potential to use digital evidence whilst minimising the costs of an investigation.\"" },
]

[nist-sp800-101r1]
label = "NIST SP 800-101r1 -- sound acquisition; chip-off is specialized/destructive"
claims = [
  { section = "Sec. 7", text = "inspect acquired data on a separate, known-clean computer; sound acquisition and evidence preservation." },
  { section = "Sec. 9", text = "encryption and file-based access controls pose challenges to data acquisition." },
  { section = "Sec. 13", text = "a write blocker preserves source integrity during acquisition." },
  { section = "Sec. 7", text = "chip-level extraction (physical removal of flash memory) is specialized and destructive, beyond most owners." },
]
quotes = [
  { text = "\"its ability to maintain the integrity of the original data source being acquired and also that of the extracted data. The former is done by blocking or otherwise eliminating write requests to the device containing the data.\"" },
  { text = "\"Level 4 Chip-Off methods involve the physical removal of memory from a mobile device to extract data, requiring extensive training in electronic engineering and file system forensics.\" / \"the risk of causing physical damage to the chip during the extraction process.\"", label = "chip-off" },
]

[rfc3227]
label = "RFC 3227 -- do not trust the suspect system's own programs"
claims = [
  { section = "Sec. 7", text = "a device suspected of compromise should not be relied upon to examine itself using its own programs; run evidence-gathering tools from trusted, protected media." },
]
quotes = [
  { text = "\"Don't trust the programs on the system. Run your evidence gathering programs from appropriately protected media (see below).\"", label = "Sec. 2.2" },
  { text = "\"you should consider that your tools might not be giving you a full picture of the system.\"", label = "Supporting, Sec. 5" },
]

[mayrhofer-android-security-model]
label = "Android Platform Security Model -- per-app UID sandbox"
claims = [
  { section = "Secs. 5, 7", text = "each app gets a distinct UNIX UID and a private directory owned by the app, so other apps cannot read it (the DAC application sandbox)." },
]
quotes = [
  { text = "\"providing each application with a unique UNIX user ID (UID) and a directory owned by the app.\"", label = "Sec. 4.3.2" },
  { text = "\"With very few exceptions, the process boundary is where security decisions are made and enforced.\"", label = "Supporting, Sec. 4.3" },
]

[magisk-install]
label = "Magisk -- systemless root needs an unlocked bootloader; patches the ramdisk, not /system"
claims = [
  { section = "Sec. 8", text = "modern rooting is systemless, patching the partition image that holds the ramdisk (and the init it carries) rather than /system, and still requires an unlocked bootloader to reflash that image, so it still forfeits the verified-boot state and hardware-backed verdicts. (Which partition holds the ramdisk varies by device -- boot, init_boot on Android 13+, or vendor_boot/recovery -- but it is never /system; the Magisk docs phrase it as \"the partition image that contains the ramdisk\".)" },
]
quotes = [
  { text = "\"Your device's bootloader has to be unlocked\" / \"you need to patch the partition image that contains the ramdisk\"." },
]

[magisk-details]
label = "Magisk -- patched init runs first and shapes the SELinux policy it then runs under"
claims = [
  { section = "Sec. 8", text = "modern root is control of init: the patched init runs before the kernel loads the SELinux policy, so the installer authors the policy its own daemon runs under (an unconstrained, permissive domain) rather than being confined by it -- an administrative-tier initramfs modification, not an enlargement of in-system root." },
]
quotes = [
  { text = "\"magiskinit replaces init as the first program to run.\" / \"Sets LD_PRELOAD (init-ld) on init to hook security_load_policy\" / \"An unconstrained, permissive domain that magiskd and all root shells run in.\"" },
]

[aosp-partitions]
label = "AOSP -- the ramdisk lives in boot (<=A12) or the init_boot partition (A13+)"
claims = [
  { section = "Sec. 8", text = "the partition that holds the ramdisk Magisk patches is named: the boot partition on devices launched with Android 12 or lower, and the dedicated init_boot partition on devices launched with Android 13 or later." },
]
quotes = [
  { text = "\"This partition also contains the generic ramdisk in devices launched in Android 12 and lower.\" (boot) / \"This partition contains a generic ramdisk. In Android 11 and 12, the generic ramdisk is in the boot partition.\" (init_boot)" },
]

[aosp-dm-verity]
label = "AOSP dm-verity -- editing /system fails verification (why systemless)"
claims = [
  { section = "Sec. 8", text = "any edit to the verified /system partition would fail dm-verity and halt verified boot, which is why modern rooting leaves /system untouched and patches the boot/init_boot ramdisk instead." },
]
quotes = [
  { text = "\"The ability to modify any of the blocks would be equivalent to breaking the cryptographic hash.\" / \"If verification fails, the device generates an I/O error indicating the block can't be read.\" / \"It appears as if the filesystem has been corrupted, as is expected.\"" },
]

[playintegrityfork]
label = "Play Integrity Fork -- a masking module's own admission it cannot forge the hardware-backed verdict"
claims = [
  { section = "Sec. 8", text = "integrity-masking modules spoof software-visible signals and pass only the basic/lock-agnostic verdict; the hardware-backed device and strong verdicts yield only to a leaked, unrevoked hardware keybox, not to spoofing." },
]
quotes = [
  { text = "\"relies on locked bootloader checks to pass even DEVICE integrity\" / \"you can't use values from recent devices due to them only being allowed with full hardware backed attestation\"." },
  { text = "\"Using Tricky Store to achieve <A13 PI STRONG integrity (with an unrevoked hardware keybox.xml)\".", label = "Supporting" },
]

[amnesty-pegasus-methodology]
label = "Amnesty International -- fewer forensic traces on Android than iOS"
