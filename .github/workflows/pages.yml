name: pages-deploy

# Deploy the previews site to GitHub Pages in the computer-security-research org.
# Gated to that org so the SAME file is harmless in the org-ai-assisted CI mirror
# (it never runs there). The site is BUILT LOCALLY in the sandbox (bin/csr-build)
# and the rendered _site (HTML + .tex + assets) is COMMITTED -- CI does NOT
# generate the HTML. Only the binary PDFs are gitignored and rendered here at
# deploy (journal-maker --pdf-only) into the committed tree. The committed build
# is non-indexable (robots Disallow + per-page noindex meta) until a go-live.

"on":
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Owner-gated AND master-only: a manual workflow_dispatch can name any ref,
    # so without the ref guard a dispatch from a branch could deploy that
    # branch's content to the live site.
    if: github.repository_owner == 'computer-security-research' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: content
          # Deploy uses the github-pages environment token, not this checkout's
          # credential; leaving it in .git/config would only widen exposure.
          persist-credentials: false

      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false

      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-fonts-recommended lmodern \
            poppler-utils qpdf citation-style-language-styles

      - name: Render PDFs into the committed site (no HTML rebuild)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles \
            --journal content/site.toml \
            --out content/_site \
            --pdf-only

      - name: Scholar / PDF / security check
        run: journal-maker/usr/bin/journal-maker check content/_site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: content/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
