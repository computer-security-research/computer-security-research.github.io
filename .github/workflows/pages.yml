name: pages-deploy

# Deploy the CSR previews site to GitHub Pages in the computer-security-research
# org. This repo holds ONLY the generated _site (committed TEXT: HTML + .tex +
# assets + the .sha512 checksum sidecars). The gitignored PDF/docx binaries are
# rebuilt HERE at deploy, inside the pinned toolchain image (built from the source
# repo's docker/Dockerfile), and VERIFIED against the committed .sha512
# (bit-for-bit reproducibility gate) -- so the served binary provably equals the
# author's local build, with no binary in git.
#
# Gated to the computer-security-research org so the same file is harmless in any
# mirror (it never runs there). The committed build is non-indexable (robots
# Disallow + per-page noindex meta, baked in at build time) until a go-live.

"on":
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CSR_IMAGE: csr-build-toolchain:latest

jobs:
  build-deploy:
    # Owner-gated AND master-only: a manual workflow_dispatch can name any ref,
    # so without the ref guard a dispatch from a branch could deploy that
    # branch's content to the live site.
    if: github.repository_owner == 'computer-security-research' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out artifacts (this repo, holds committed _site)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: artifacts
          persist-credentials: false

      - name: Check out source (articles/site.toml + docker assets)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/computer-security-research-source
          path: source
          persist-credentials: false

      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false

      - name: Check out dist-ai (webcheck suite)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Rebuild PDFs in the image + VERIFY against committed .sha512
        run: >
          bash source/docker/docker-build-site.sh
          "${GITHUB_WORKSPACE}/journal-maker"
          "${GITHUB_WORKSPACE}/source"
          "${GITHUB_WORKSPACE}/artifacts"
          --pdf-only --verify-sha

      - name: Scholar / PDF / security check (in image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C
          --volume "${GITHUB_WORKSPACE}/journal-maker:/jm:ro"
          --volume "${GITHUB_WORKSPACE}/artifacts:/work:ro"
          "${CSR_IMAGE}" /jm/usr/bin/journal-maker check /work/_site

      - name: Static consistency (check_site, in image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C
          --volume "${GITHUB_WORKSPACE}/dist-ai:/da:ro"
          --volume "${GITHUB_WORKSPACE}/artifacts:/work:ro"
          "${CSR_IMAGE}" /da/usr/share/website-tests/check_site.py /work/_site

      - name: SVG active-content safety (in image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C
          --volume "${GITHUB_WORKSPACE}/dist-ai:/da:ro"
          --volume "${GITHUB_WORKSPACE}/artifacts:/work:ro"
          "${CSR_IMAGE}" /da/usr/share/website-tests/check_svg_safety.py /work/_site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
