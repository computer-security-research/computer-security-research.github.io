# AI-Assisted.
# Playwright browser lanes (mobile-overflow + width-utilization) for the
# COMMITTED _site. The site is built locally in the sandbox (bin/csr-build) and
# committed, so these lanes need NO build and NO journal-maker/texlive -- they
# run the guards straight against the committed tree. The browser-free webcheck
# lanes (check_site + svg) live in build.yml; the heavier lint/vnu/lighthouse/axe
# lanes are Qubes-sandbox-delegated via `website-tests` -- see the csr skill.

name: web-tests

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: content, persist-credentials: false }
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false
      - name: Mobile-overflow guard
        run: ./dist-ai/ci/website-mobile-check.sh "${GITHUB_WORKSPACE}/content/_site"

  width:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: content, persist-credentials: false }
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false
      - name: Width-utilization guard
        run: ./dist-ai/ci/website-width-check.sh "${GITHUB_WORKSPACE}/content/_site"
