# AI-Assisted.
# Comprehensive website-consistency gate for the generated site, split into
# PARALLEL jobs so no single job exceeds the runner budget:
#   static  -- full build (PDF, for check_site's PDF-link resolution) then the
#              browser-free webcheck lanes check_site.py + check_svg_safety.py
#   mobile  -- HTML-only build + website-mobile-check.sh (Playwright)
#   width   -- HTML-only build + website-width-check.sh  (Playwright)
# The heavier lanes (lint / vnu / lighthouse / axe) are Qubes-sandbox-delegated in
# dist-ai, so they CANNOT run on a GitHub runner; they run host-driven via
# `website-tests`. See the csr skill.
# NOTE: the generator builds with pdflatex (not xelatex), so texlive-xetex is NOT
# installed -- only texlive-latex-recommended + fonts + lmodern.

name: web-tests

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: content, persist-credentials: false }
      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false
      - name: Install build + check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-fonts-recommended lmodern \
            poppler-utils qpdf python3-pil python3-yaml python3-defusedxml
      - name: Build site (full, with PDF)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles --journal content/site.toml --out _site
      - name: Static consistency (check_site)
        run: ./dist-ai/usr/share/website-tests/check_site.py "${GITHUB_WORKSPACE}/_site"
      - name: SVG active-content safety
        run: ./dist-ai/usr/share/website-tests/check_svg_safety.py "${GITHUB_WORKSPACE}/_site"

  mobile:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: content, persist-credentials: false }
      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Build site (HTML only)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles --journal content/site.toml \
            --out _site --skip-pdf
      - name: Mobile-overflow guard
        run: ./dist-ai/ci/website-mobile-check.sh "${GITHUB_WORKSPACE}/_site"

  width:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: content, persist-credentials: false }
      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Build site (HTML only)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles --journal content/site.toml \
            --out _site --skip-pdf
      - name: Width-utilization guard
        run: ./dist-ai/ci/website-width-check.sh "${GITHUB_WORKSPACE}/_site"
