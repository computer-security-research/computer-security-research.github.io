name: build-and-check

# Fail-closed gate: build the site (with PDF) once, then run every check that
# needs that built tree -- journal-maker's own Scholar/PDF/supply-chain check
# PLUS the browser-free dist-ai webcheck lanes (check_site consistency + svg
# safety). This is the ONLY job that installs texlive, so the PDF build is never
# duplicated; the Playwright mobile/width lanes live in web-tests.yml (no texlive).
# (VirusTotal of assets is a separate operator-run pre-publish gate.)

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: content
          persist-credentials: false

      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false

      - name: Check out dist-ai (webcheck suite)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Install build + check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-fonts-recommended lmodern \
            poppler-utils qpdf librsvg2-bin citation-style-language-styles \
            python3-bs4 python3-html5lib python3-pil python3-yaml python3-defusedxml

      - name: Tool selftest
        run: journal-maker/usr/bin/journal-maker selftest

      - name: Build site (full, with PDF)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles \
            --journal content/site.toml \
            --out _site

      - name: Scholar / PDF / security check
        run: journal-maker/usr/bin/journal-maker check _site

      - name: Static consistency (check_site)
        run: ./dist-ai/usr/share/website-tests/check_site.py "${GITHUB_WORKSPACE}/_site"

      - name: SVG active-content safety
        run: ./dist-ai/usr/share/website-tests/check_svg_safety.py "${GITHUB_WORKSPACE}/_site"
