name: build-and-check

# Fail-closed gate: build the journal and run the Scholar-compliance + PDF
# sanity + PDF supply-chain checker. Nothing deploys unless this is green.
# (VirusTotal of all assets is a separate operator-run pre-publish gate --
# it needs the vtai.py client and token, which CI does not hold.)

"on":
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v4
        with:
          path: content

      - name: Check out journal-maker
        uses: actions/checkout@v4
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended \
            texlive-fonts-recommended lmodern poppler-utils qpdf

      - name: Tool selftest
        run: journal-maker/usr/bin/journal-maker selftest

      - name: Build site
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles \
            --journal content/journal.toml \
            --out _site

      - name: Scholar / PDF / security check
        run: journal-maker/usr/bin/journal-maker check _site
