name: build-and-check

# Verify the COMMITTED _site (built locally in the sandbox via bin/csr-build and
# committed as text). CI does NOT regenerate the HTML; it only renders the
# gitignored PDFs (journal-maker --pdf-only) so the PDF/Scholar gate can run, then
# checks the committed tree. The browser mobile/width lanes live in web-tests.yml.

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: content
          persist-credentials: false

      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false

      - name: Check out dist-ai (webcheck suite)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-fonts-recommended lmodern \
            poppler-utils qpdf citation-style-language-styles \
            python3-bs4 python3-html5lib python3-pil python3-yaml python3-defusedxml

      - name: Render PDFs into the committed site (no HTML rebuild)
        run: |
          journal-maker/usr/bin/journal-maker build \
            --articles content/articles \
            --journal content/site.toml \
            --out content/_site \
            --pdf-only

      - name: Scholar / PDF / security check
        run: journal-maker/usr/bin/journal-maker check content/_site

      - name: Static consistency (check_site)
        run: ./dist-ai/usr/share/website-tests/check_site.py "${GITHUB_WORKSPACE}/content/_site"

      - name: SVG active-content safety
        run: ./dist-ai/usr/share/website-tests/check_svg_safety.py "${GITHUB_WORKSPACE}/content/_site"
